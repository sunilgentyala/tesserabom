name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch CycloneDX 1.6 schema (pinned tag)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cdx"
          for f in bom-1.6.schema.json spdx.schema.json jsf-0.82.schema.json; do
            curl -sSfL "https://raw.githubusercontent.com/CycloneDX/specification/1.6/schema/$f" -o "$RUNNER_TEMP/cdx/$f"
          done
          echo "CYCLONEDX_SCHEMA_DIR=$RUNNER_TEMP/cdx" >> "$GITHUB_ENV"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install bandit pip-audit
      - run: python -m bandit -r src -ll
      - run: python -m pip install -e . && python -m pip_audit --skip-editable
